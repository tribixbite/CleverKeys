# Development Build Workflow
# Purpose: publish installable dev builds. NOT a CI gate.
# - Restores the persistent debug keystore from secrets, so every dev APK shares
#   one signature and installs as an upgrade over the previous one
# - Generates app icons
# - Renames APKs with the commit SHA
# - Publishes a `dev-<sha>` prerelease on main-branch pushes
# The CI gate (tests, lint, security scan, APK size analysis) is ci.yml.
# Tag releases are release.yml. There is no build.yml — it was folded into ci.yml.
#
# Trigger scope (ARC-040): this used to also run on `pull_request` and on pushes to
# `develop`, where ci.yml already runs `assembleDebug` — two full builds per event,
# with the release step gated off, so the second build produced nothing but a
# duplicate artifact. Those triggers are gone.
#
# The main-branch push is deliberately KEPT despite ci.yml also building there: the
# two APKs are not interchangeable. ci.yml has no DEBUG_KEYSTORE secret, so
# build.gradle generates a throwaway keystore per run (build.gradle:880) and its
# artifact cannot be installed over an earlier build. Only this workflow's APK is
# signed with the stable key, and it is the one users actually receive. Use
# workflow_dispatch to get a signed APK for a branch or PR.

name: Build CleverKeys APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'

permissions:
  contents: write

jobs:
  Build-APK:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Restore debug keystore from GitHub Secrets
      run: |
        # DEBUG_KEYSTORE should contain base64-encoded content of debug.keystore.asc
        # Create it with: cat debug.keystore.asc | base64 -w0
        # Or use GPG: gpg -c --passphrase "debug0" --batch debug.keystore && base64 -w0 debug.keystore.gpg
        if [[ ! "${{ secrets.DEBUG_KEYSTORE }}" = "" ]]; then
            echo "Restoring debug keystore from GitHub secrets"
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > "debug.keystore.asc"
            if [[ -s "debug.keystore.asc" ]]; then
                gpg -d --passphrase "debug0" --batch "debug.keystore.asc" > "debug.keystore"
                echo "Debug keystore restored ($(wc -c < debug.keystore) bytes)"
            else
                echo "Warning: decoded keystore.asc is empty"
            fi
        else
            echo "No DEBUG_KEYSTORE secret found, will auto-generate keystore"
        fi

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # Only this dev-build workflow regenerates the icons. F-Droid builds the tagged commit with the
    # committed res/mipmap-* icons and compares against release.yml's APK, which never runs this,
    # so nothing here can change F-Droid's reproducibility check.
    # The runner's apt mirrors fail DNS now and then (83896fe0: twice): skip the install when
    # ImageMagick is already on the image, retry it otherwise, and if it still fails build with
    # the committed icons (made from the same source image) rather than failing the dev build.
    - name: Install ImageMagick
      id: imagemagick
      run: |
        # A variable, not a pipe: under the runner's pipefail an early-exiting reader could
        # SIGPIPE convert and make an installed ImageMagick look missing.
        version=$(convert -version 2>/dev/null || true)
        if [[ "$version" == *ImageMagick* ]]; then
          echo "ImageMagick already installed: ${version%%$'\n'*}"
          echo "available=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        for attempt in 1 2 3; do
          if sudo apt-get update -o Acquire::Retries=3 \
             && sudo apt-get install -y -o Acquire::Retries=3 imagemagick; then
            echo "available=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "apt attempt $attempt failed"
          [ $attempt -lt 3 ] && { echo "retrying in $((attempt * 30)) s"; sleep $((attempt * 30)); }
        done
        echo "::warning::ImageMagick could not be installed; building with the committed icons"
        echo "available=false" >> "$GITHUB_OUTPUT"

    - name: Generate App Icons
      if: steps.imagemagick.outputs.available == 'true'
      run: |
        chmod +x scripts/generate_icons.sh
        ./scripts/generate_icons.sh

    - name: Clean Gradle
      run: ./gradlew clean

    - name: Build debug APK
      run: ./gradlew assembleDebug
      env:
        DEBUG_KEYSTORE: "debug.keystore"
        DEBUG_KEYSTORE_PASSWORD: debug0
        DEBUG_KEY_ALIAS: debug
        DEBUG_KEY_PASSWORD: debug0

    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Rename APKs with version
      run: |
        cd build/outputs/apk/debug
        for apk in *.apk; do
          if [[ "$apk" == *"universal"* ]]; then
            mv "$apk" "CleverKeys-${{ steps.sha.outputs.short }}-universal.apk"
          elif [[ "$apk" == *"arm64-v8a"* ]]; then
            mv "$apk" "CleverKeys-${{ steps.sha.outputs.short }}-arm64.apk"
          elif [[ "$apk" == *"armeabi-v7a"* ]]; then
            mv "$apk" "CleverKeys-${{ steps.sha.outputs.short }}-armv7.apk"
          elif [[ "$apk" == *"x86_64"* ]]; then
            mv "$apk" "CleverKeys-${{ steps.sha.outputs.short }}-x86_64.apk"
          else
            mv "$apk" "CleverKeys-${{ steps.sha.outputs.short }}.apk"
          fi
        done
        ls -la *.apk

    - name: Upload debug APKs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "cleverkeys-debug-${{ steps.sha.outputs.short }}"
        path: build/outputs/apk/debug/*.apk

    - name: Upload to releases (on every push to main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: build/outputs/apk/debug/*.apk
        tag_name: "dev-${{ steps.sha.outputs.short }}"
        name: "CleverKeys Dev Build (${{ steps.sha.outputs.short }})"
        prerelease: true  # Mark as prerelease so Obtainium ignores dev builds
        body: |
          CleverKeys Android APK - Development Build

          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Date:** ${{ github.event.head_commit.timestamp }}

          ## Downloads (per-ABI)
          | APK | Device |
          |-----|--------|
          | **arm64** | Most modern phones (2017+) |
          | **armv7** | Older 32-bit phones |
          | **x86_64** | Emulators, Chromebooks |
          | **universal** | All devices |

          ## Installation
          1. Download the APK matching your device
          2. Enable "Unknown sources" in Android settings
          3. Install and activate in Language & Input settings

    # Tag releases are handled by release.yml workflow (not this one)
    # This workflow only creates dev releases for main branch pushes
