name: CI

on:
  push:
    branches: [ main, develop ]
    tags-ignore:
      - '**'  # Don't run on tag pushes - release.yml handles those
  pull_request:
    branches: [ main, develop ]

# Required for security scan SARIF upload
permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Run pure JVM tests
      run: ./gradlew runPureTests --stacktrace
      # MockK tests (runMockTests) require android.jar stubs + specific classpath
      # ordering that can hang on CI runners. Run via ew-cli instrumented tests instead.

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: test-results
        path: |
          build/reports/tests/
          build/test-results/
        retention-days: 7

    - name: Run lint checks
      # Lint gate phase 1: abortOnError=true in build.gradle + baseline suppresses
      # pre-existing issues, so this fails only on NEW lint regressions.
      # NOTE: bare `lint` resolves to the DEFAULT variant, i.e. DEBUG. Release is linted
      # by the next step — do not assume this one covers it.
      run: ./gradlew lint --stacktrace

    - name: Run release lint checks
      # ARC-096: release is the ONLY minified variant and the one users install, and until
      # now NOTHING linted it — this job's `lint` is debug, and release.yml runs `lintDebug`.
      # Release-only issues (R8/shrinker-visible, `release` sourceSet, minify-dependent
      # manifest merges) were therefore invisible to every gate.
      #
      # lintVitalRelease is AGP's minimal release gate — fatal-severity issues only — which is
      # what keeps this cheap alongside the full debug lint above. It exists only because
      # build.gradle now sets checkReleaseBuilds=true; at false AGP does not register the task
      # at all ("Task 'lintVitalRelease' not found"), which is why nothing could lint release.
      # That same flag makes `assembleRelease` self-gate, so this step is what covers PRs,
      # which build debug only.
      run: ./gradlew lintVitalRelease --stacktrace

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success()
      with:
        name: apk-debug
        path: build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload lint results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: lint-results
        path: build/reports/lint-results*.xml
        retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Lint runs (as a hard gate) in the "Build and Test" job; not duplicated here.
    - name: Dependency analysis
      run: ./gradlew dependencies --stacktrace

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run security scan
      # SHA-pinned (= v0.36.0). Aqua deletes old version tags (0.28.0 was removed, which
      # failed this job at "Set up job"); a commit SHA can't be retagged away. To bump,
      # resolve a newer release tag to its commit SHA.
      #
      # BLOCKING (CK-150-023): this step used to carry `continue-on-error: true`, so the PR
      # path reported vulnerabilities and shipped anyway. The bar is now IDENTICAL to the
      # release `security-gate` in release.yml — same severity, same unfixed policy, same
      # exit-code — so nothing can pass here and fail at tag time (or vice versa). Keep the
      # two steps in sync when either changes.
      #
      # Accepted: unfixed upstream CVEs do not block the PR path; fixed HIGH/CRITICAL do.
      # Revisit alongside the release gate's identical note.
      # SPLIT (2026-08-29): trivy IGNORES --severity in SARIF mode — the SARIF always
      # carries every severity, and exit-code then fires on the unfiltered set, so this
      # step was red on unfixable MEDIUM/LOW findings the policy above explicitly accepts
      # (observed: 11 medium/low results, zero HIGH/CRITICAL, exit 1). The documented
      # pattern is two invocations: SARIF for code-scanning upload with no exit code,
      # then a table-format gate that honors the severity filter AND prints its findings
      # into the job log (the SARIF step never showed WHAT failed). release.yml's
      # security-gate is already table-format and needs no split.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    - name: Upload security results
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Gate on fixed HIGH/CRITICAL vulnerabilities
      # The BLOCKING half (CK-150-023): identical policy to release.yml's security-gate —
      # same severity, same unfixed policy, same exit-code. Keep the two in sync.
      # Table format = severity filter is honored AND findings print in this log.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        # Without this the action always exits 0 and the step would be decorative.
        exit-code: '1'

  # Per-ABI APK size report (folded in from the former build.yml, which duplicated
  # assembleDebug). Consumes the debug APKs uploaded by the "Build and Test" job.
  size-analysis:
    name: APK Size Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download debug APKs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: apk-debug
        path: ./

    - name: Analyze APK sizes
      run: |
        echo "## Build Analysis - Per-ABI APK Sizes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| ABI | Size | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|------|--------|" >> $GITHUB_STEP_SUMMARY

        ls -la *.apk || { echo "No APK files found"; ls -la; exit 1; }

        FAIL=0
        for APK_FILE in *.apk; do
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))

          # Determine ABI from filename
          if [[ "$APK_FILE" == *"universal"* ]]; then
            ABI="universal"
            MAX_SIZE=60
          elif [[ "$APK_FILE" == *"arm64"* ]]; then
            ABI="arm64-v8a"
            MAX_SIZE=40
          elif [[ "$APK_FILE" == *"armeabi"* ]] || [[ "$APK_FILE" == *"armv7"* ]]; then
            ABI="armeabi-v7a"
            MAX_SIZE=35
          elif [[ "$APK_FILE" == *"x86_64"* ]]; then
            ABI="x86_64"
            MAX_SIZE=40
          else
            ABI="unknown"
            MAX_SIZE=60
          fi

          if [ $APK_SIZE_MB -gt $MAX_SIZE ]; then
            echo "| $ABI | ${APK_SIZE_MB}MB | ⚠️ Exceeds ${MAX_SIZE}MB |" >> $GITHUB_STEP_SUMMARY
            FAIL=1
          else
            echo "| $ABI | ${APK_SIZE_MB}MB | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          fi
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Swipe Model**: Included (ONNX Runtime + CTC encoder)" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: tribixbite.cleverkeys" >> $GITHUB_STEP_SUMMARY

        if [ $FAIL -eq 1 ]; then
          echo "::warning::Some APKs exceed size thresholds"
        fi
