name: UI & Performance Testing

on:
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6 AM UTC to catch regressions
    - cron: '0 6 * * *'
  workflow_dispatch:

# Concurrency: cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.build.outputs.apk-path }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build debug APK
      id: build
      run: |
        chmod +x gradlew
        # assembleDebugAndroidTest too: without the test APK the emulator job can only smoke
        # test, which is how two instrumented failures sat red for a day and a half.
        ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
        # Find the x86_64 APK for emulator testing
        X86_APK=$(find build/outputs/apk/debug -name "*x86_64*.apk" | head -1)
        if [ -z "$X86_APK" ]; then
          # Fallback to universal if no x86_64 specific
          X86_APK=$(find build/outputs/apk/debug -name "*universal*.apk" | head -1)
        fi
        echo "apk-path=$X86_APK" >> $GITHUB_OUTPUT
        echo "Found APK for testing: $X86_APK"

    - name: Upload APK for testing
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: build/outputs/apk/debug/*x86_64*.apk
        retention-days: 1
        if-no-files-found: warn

    - name: Upload androidTest APK
      uses: actions/upload-artifact@v4
      with:
        name: apks-androidtest
        path: build/outputs/apk/androidTest/debug/*.apk
        retention-days: 1
        if-no-files-found: error

    - name: Upload universal APK as fallback
      uses: actions/upload-artifact@v4
      with:
        name: apks-universal
        path: build/outputs/apk/debug/*universal*.apk
        retention-days: 1
        if-no-files-found: warn

  ui-tests:
    name: UI Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Focus on key API levels: min supported, common, latest
        api-level: [21, 29, 34]
        include:
          - api-level: 21
            target: default
            arch: x86_64
          - api-level: 29
            target: default
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: apks
        path: ./apk/

    - name: Download androidTest APK
      uses: actions/download-artifact@v4
      with:
        name: apks-androidtest
        path: ./apk-test/

    - name: Verify APK download
      run: |
        echo "Downloaded APK files:"
        ls -la ./apk/ ./apk-test/
        APK_FILE=$(find ./apk -name "*.apk" | head -1)
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
        TEST_APK_FILE=$(find ./apk-test -name "*.apk" | head -1)
        [ -n "$TEST_APK_FILE" ] || { echo "::error::androidTest APK missing"; exit 1; }
        echo "TEST_APK_FILE=$TEST_APK_FILE" >> $GITHUB_ENV

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run UI Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: ${{ matrix.target }}
        arch: ${{ matrix.arch }}
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
        disable-animations: true
        script: bash .github/scripts/emulator-ci.sh gate
    - name: Upload instrumentation log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumentation-log-api${{ matrix.api-level }}
        path: instrumentation.log
        retention-days: 7
        if-no-files-found: warn

    - name: Upload settings screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-settings-screenshot-api${{ matrix.api-level }}
        path: settings-screenshot.png
        retention-days: 7
        if-no-files-found: ignore

  screenshot-capture:
    name: Screenshot Capture
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: apks
        path: ./apk/

    - name: Verify APK download
      run: |
        APK_FILE=$(find ./apk -name "*.apk" | head -1)
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Capture Settings Screenshot
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
        disable-animations: true
        script: bash .github/scripts/emulator-ci.sh capture
    - name: Upload screenshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: settings-screenshot-capture
        path: screenshots/
        retention-days: 30
        if-no-files-found: ignore

    - name: Generate summary
      run: |
        echo "## Screenshot Capture Results" >> $GITHUB_STEP_SUMMARY
        if [ -d screenshots ] && [ "$(ls -A screenshots)" ]; then
          echo "- Keyboard Layout: Captured" >> $GITHUB_STEP_SUMMARY
          echo "- Shift State: Captured" >> $GITHUB_STEP_SUMMARY
        else
          echo "- No screenshots captured (keyboard may not have opened)" >> $GITHUB_STEP_SUMMARY
        fi

  accessibility-testing:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: apks
        path: ./apk/

    - name: Download androidTest APK
      uses: actions/download-artifact@v4
      with:
        name: apks-androidtest
        path: ./apk-test/

    - name: Verify APK download
      run: |
        APK_FILE=$(find ./apk -name "*.apk" | head -1)
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
        TEST_APK_FILE=$(find ./apk-test -name "*.apk" | head -1)
        [ -n "$TEST_APK_FILE" ] || { echo "::error::androidTest APK missing"; exit 1; }
        echo "TEST_APK_FILE=$TEST_APK_FILE" >> $GITHUB_ENV

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Accessibility Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
        disable-animations: true
        script: bash .github/scripts/emulator-ci.sh a11y
    - name: Generate accessibility summary
      if: success()
      run: |
        echo "## Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Keyboard installed and enabled" >> $GITHUB_STEP_SUMMARY
        echo "- IME registration verified via dumpsys" >> $GITHUB_STEP_SUMMARY
        echo "- Keyboard accessibility instrumented test passed" >> $GITHUB_STEP_SUMMARY
    - name: Upload accessibility instrumentation log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-instrumentation-log
        path: instrumentation.log
        if-no-files-found: warn

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ui-tests, screenshot-capture, accessibility-testing]
    if: always()

    steps:
    - name: Generate test summary
      run: |
        echo "# CleverKeys Testing Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results Overview" >> $GITHUB_STEP_SUMMARY
        echo "- **UI Tests**: ${{ needs.ui-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Screenshot Capture**: ${{ needs.screenshot-capture.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Accessibility Tests**: ${{ needs.accessibility-testing.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Key Metrics Tested" >> $GITHUB_STEP_SUMMARY
        echo "- UI responsiveness across Android versions (API 21, 29, 34)" >> $GITHUB_STEP_SUMMARY
        echo "- Settings screen capture artifact (no baseline comparison)" >> $GITHUB_STEP_SUMMARY
        echo "- Keyboard virtual nodes, actions, hover-off path, and touch-path smoke" >> $GITHUB_STEP_SUMMARY
