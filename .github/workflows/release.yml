name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # GATE: run the full JVM + MockK test suites before publishing. A red suite
  # blocks the release (release: needs: test) so a broken build never ships.
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Require tag commit on main
      run: |
        git fetch origin main --no-tags
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
          || { echo "::error::tag commit is not reachable from main"; exit 1; }

    # CK-150-035: this used to run in the final `release` job, after ~1h of gates. A tag that
    # does not match build.gradle is knowable in seconds, so it is checked here — first thing
    # after the checkout, before any toolchain setup.
    - name: Verify tag matches build.gradle version
      run: |
        TAG_VERSION=${GITHUB_REF_NAME#v}

        # Extract VERSION_MAJOR, VERSION_MINOR, VERSION_PATCH from build.gradle
        GRADLE_MAJOR=$(grep "VERSION_MAJOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_MINOR=$(grep "VERSION_MINOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_PATCH=$(grep "VERSION_PATCH" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_VERSION="${GRADLE_MAJOR}.${GRADLE_MINOR}.${GRADLE_PATCH}"

        echo "🏷️  Git Tag Version: $TAG_VERSION"
        echo "📦 Gradle Version:  $GRADLE_VERSION"

        if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
          echo "::error::VERSION MISMATCH! Git tag ($TAG_VERSION) does not match build.gradle ($GRADLE_VERSION)"
          echo "Please update VERSION_MAJOR/MINOR/PATCH in build.gradle to match the tag."
          exit 1
        fi

        echo "✅ Version match confirmed!"

    - name: Source hygiene preflight
      run: |
        test -z "$(git status --porcelain --untracked-files=all)"
        # CK-150-035: the range used to be hardcoded `v1.5.0..HEAD`, which silently widens
        # every release (at v1.7 it would re-check two releases' worth of commits). Derive
        # the previous tag instead, via `git describe --tags --abbrev=0` (the idiom the
        # changelog fallback uses below), with two necessary tightenings:
        #   - `HEAD^`, because HEAD *is* the release tag: describing from HEAD returns the
        #     tag being released, making the range empty and the check vacuous;
        #   - `--match 'v*'`, because the repo also carries non-release `dev-*` tags that
        #     would otherwise win and produce a meaningless range.
        # `fetch-depth: 0` above is what makes the tags available here; if it ever regresses
        # this fails loudly instead of degrading into a no-op.
        PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "::error::no previous v* tag reachable from HEAD^ — cannot derive the whitespace-check range (is the checkout missing tags?)"
          exit 1
        fi
        echo "Whitespace check over $PREV_TAG..HEAD"
        git diff --check "$PREV_TAG..HEAD"

    - name: Setup Java 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    # runMockTests resolves android.jar from platforms/android-34 for the stubs.
    - name: Install pinned SDK components
      run: sdkmanager "platforms;android-34"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Run pure JVM tests
      run: ./gradlew runPureTests --stacktrace

    - name: Run MockK tests
      timeout-minutes: 20
      run: ./gradlew runMockTests --stacktrace

    - name: Run Android lint and compile instrumented tests
      run: ./gradlew lintDebug compileDebugAndroidTestKotlin --stacktrace

    - name: Build emulator artifacts
      run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

    - name: Upload emulator artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-gate-apks
        path: |
          build/outputs/apk/debug/*x86_64*.apk
          build/outputs/apk/androidTest/debug/*.apk
        if-no-files-found: error

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest

    - name: Run web-demo parity and smoke tests
      working-directory: web_demo/tests
      run: |
        bun install --frozen-lockfile
        bun run ctc-app-parity
        bun run ctc-app-smoke

    - name: Verify demo model matches Android asset
      run: cmp web_demo/ctc_swipe_encoder.onnx src/main/assets/models/ctc_swipe_encoder.onnx

  device-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-gate-apks
        path: ./gate-apks
    - name: Resolve APKs
      run: |
        echo "APK_FILE=$(find gate-apks -path '*debug*' -name '*x86_64*.apk' ! -path '*androidTest*' | head -1)" >> "$GITHUB_ENV"
        echo "TEST_APK_FILE=$(find gate-apks -path '*androidTest*' -name '*.apk' | head -1)" >> "$GITHUB_ENV"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run curated device and accessibility gates
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
        disable-animations: true
        script: bash .github/scripts/emulator-ci.sh gate

  security-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Block high/critical repository vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: table
        severity: HIGH,CRITICAL
        # Accepted: unfixed upstream CVEs do not block release; fixed HIGH/CRITICAL do.
        # Revisit each release.
        ignore-unfixed: true
        exit-code: '1'

  release:
    needs: [test, device-gate, security-gate]
    runs-on: ubuntu-latest
    # REPRODUCIBILITY: Set deterministic locale and timezone for consistent builds
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    # REPRODUCIBILITY: Pin Java 17 to match F-Droid build server
    # Different Java versions can produce different R8/DEX output
    - name: Setup Java 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    # REPRODUCIBILITY: Install FRESH SDK components to match F-Droid exactly
    # GitHub may have outdated cached versions - remove and reinstall to get latest revision
    # F-Droid downloads platform-34-ext7_r03.zip - we need the same
    - name: Install pinned SDK components
      run: |
        # Remove pre-installed platform to ensure we get latest revision
        rm -rf $ANDROID_HOME/platforms/android-34
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "BUILD_TOOLS_VERSION=34.0.0" >> $GITHUB_ENV
        # Show what revision was installed
        ls -la $ANDROID_HOME/platforms/android-34/

    - name: Add Android SDK tools to PATH
      run: |
        # Use build-tools 34.0.0 for F-Droid reproducibility (v35+ breaks apksigcopier)
        BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
        echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
        echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
        echo "📦 Build tools: $BUILD_TOOLS_DIR"
        echo "📦 Java: $(java -version 2>&1 | head -1)"
        ls -la $BUILD_TOOLS_DIR/zipalign $BUILD_TOOLS_DIR/apksigner 2>/dev/null || echo "Tools check"

    - name: Cache Gradle packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Extract version info
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

        # Parse semantic version: vMAJOR.MINOR.PATCH -> code = MAJOR*10000 + MINOR*100 + PATCH
        VERSION=${TAG_NAME#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3 | sed 's/[^0-9].*//')
        VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "📦 Version: $VERSION (code: $VERSION_CODE)"

    # The authoritative tag↔build.gradle check now runs in the `test` gate job (CK-150-035),
    # so a mismatch fails in seconds instead of after ~1h of gates. This is a cheap re-assert
    # against the VERSION this job actually builds with, in case the two jobs ever check out
    # different trees.
    - name: Re-assert tag matches build.gradle version
      run: |
        GRADLE_MAJOR=$(grep "VERSION_MAJOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_MINOR=$(grep "VERSION_MINOR" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_PATCH=$(grep "VERSION_PATCH" build.gradle | head -1 | sed 's/.*= *//' | tr -d ' ')
        GRADLE_VERSION="${GRADLE_MAJOR}.${GRADLE_MINOR}.${GRADLE_PATCH}"

        if [ "$VERSION" != "$GRADLE_VERSION" ]; then
          echo "::error::VERSION MISMATCH! Git tag ($VERSION) does not match build.gradle ($GRADLE_VERSION)"
          exit 1
        fi

        echo "✅ Version match confirmed ($VERSION)"

    # Decode keystore for later signing (do NOT set RELEASE_KEYSTORE env var here
    # to ensure build.gradle builds unsigned APK)
    - name: Decode signing keystore
      run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > ${{ github.workspace }}/release.keystore

    - name: Print R8 Version
      run: ./gradlew printR8Version

    # REPRODUCIBILITY: Build EACH ABI separately to match F-Droid
    # F-Droid builds each ABI as a separate job with sed to modify build.gradle
    # Building all ABIs together causes different AAPT2 resource compilation
    - name: Build APKs per-ABI (matching F-Droid)
      run: |
        # Create final output directory (separate from build/outputs to survive clean)
        mkdir -p final_apks

        for ABI in armeabi-v7a arm64-v8a x86_64; do
          echo "========================================="
          echo "🔨 Building $ABI APK..."
          echo "========================================="

          # Reset build.gradle to original state
          git checkout build.gradle

          # Apply same sed command as F-Droid prebuild
          # This changes: include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
          # To:          include '$ABI'
          sed -i -e "s/include 'armeabi-v7a'.*/include '$ABI'/" build.gradle

          # Verify the change
          echo "Modified splits.abi.include:"
          grep "include '" build.gradle | grep -v "//"

          # Clean and build this single ABI
          ./gradlew clean assembleRelease --stacktrace --no-build-cache

          # Find the output APK
          BUILT_APK=$(find build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$BUILT_APK" ]; then
            # Extract version from filename
            VERSION_NAME=$(echo "$BUILT_APK" | grep -oP 'v\d+\.\d+\.\d+' || echo "v${{ env.VERSION }}")
            FINAL_NAME="CleverKeys-${VERSION_NAME}-${ABI}.apk"
            FINAL_PATH="final_apks/$FINAL_NAME"

            # Move to final directory (survives clean)
            mv "$BUILT_APK" "$FINAL_PATH"
            echo "✅ Built: $FINAL_NAME → saved to $FINAL_PATH"
          else
            echo "❌ ERROR: No APK found for $ABI"
            exit 1
          fi

          echo ""
        done

        # Restore original build.gradle
        git checkout build.gradle

        # Copy all APKs to expected location for release step
        mkdir -p build/outputs/apk/release
        cp final_apks/*.apk build/outputs/apk/release/

        echo "========================================="
        echo "📦 All APKs built:"
        ls -la build/outputs/apk/release/*.apk
        echo "========================================="

    # Sign the APKs with our release key after fixes
    # inplace-fix.py already did zipalign with -P 16
    - name: Sign release APKs
      run: |
        cd build/outputs/apk/release
        for apk in *.apk; do
          echo "Signing $apk..."
          # Sign with apksigner (APK already zipaligned by inplace-fix.py)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks ${{ github.workspace }}/release.keystore \
            --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            "$apk"
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify "$apk" && echo "✅ $apk verified"
        done

    - name: List release APKs
      run: |
        cd build/outputs/apk/release
        echo "=== Release APKs ==="
        ls -la CleverKeys-*.apk || echo "No APKs found!"
        echo ""
        echo "📦 Version: ${{ env.VERSION }} (code: ${{ env.VERSION_CODE }})"

    - name: Generate changelog
      run: |
        echo "## What's New in ${{ env.TAG_NAME }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md

        # The per-version fastlane changelog is the single source of truth for BOTH the
        # GitHub release body and F-Droid's in-app "What's New" (materialized per version by
        # scripts/prepare-release.sh). Do NOT read the mutable repo-root RELEASE_NOTES.md
        # here: a stale RELEASE_NOTES.md (left at v1.2.9) once shadowed the correct fastlane
        # file and shipped v1.2.9 text as the v1.4.0 release body. arm64 ABI suffix = 2.
        CHANGELOG_CODE=$((${{ env.VERSION_CODE }} * 10 + 2))
        CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CHANGELOG_CODE}.txt"

        if [ -f "$CHANGELOG_FILE" ]; then
          cat "$CHANGELOG_FILE" >> CHANGELOG.md
          echo "📋 Read changelog from $CHANGELOG_FILE"
        else
          # Fallback: base versionCode without ABI suffix
          CHANGELOG_FILE_ALT="fastlane/metadata/android/en-US/changelogs/${{ env.VERSION_CODE }}.txt"
          if [ -f "$CHANGELOG_FILE_ALT" ]; then
            cat "$CHANGELOG_FILE_ALT" >> CHANGELOG.md
            echo "📋 Read changelog from $CHANGELOG_FILE_ALT"
          else
            # Final fallback: generate from commits
            echo "⚠️ No changelog found, generating from commits"
            # --match 'v*' for the same reason as :65 — this repo carries `dev-*` tags
            # that would otherwise hijack the "previous release" lookup.
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Changes since $LAST_TAG:" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              git log $LAST_TAG..HEAD --pretty=format:"- %s" >> CHANGELOG.md
            else
              echo "- Initial release with on-device swipe typing" >> CHANGELOG.md
            fi
          fi
        fi

        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "---" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Build Information" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        # ⚠️  F-Droid REQUIRED: these two colon-delimited lines are what the
        #     upstream fdroiddata bot (tribixbite.cleverkeys.yml) scrapes via
        #     UpdateCheckMode: HTTP + UpdateCheckData regex
        #     `VersionCode:\s(\d+)|.|Version:\s([\d.]+)` to detect new
        #     releases. Removing or reformatting them silently breaks
        #     F-Droid auto-update (this happened in v1.2.9–v1.3.0, which
        #     F-Droid never picked up). Keep them EXACTLY in this form.
        echo "Version: ${{ env.VERSION }}" >> CHANGELOG.md
        echo "VersionCode: ${{ env.VERSION_CODE }}" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "| Property | Value |" >> CHANGELOG.md
        echo "|----------|-------|" >> CHANGELOG.md
        echo "| Version | ${{ env.VERSION }} |" >> CHANGELOG.md
        echo "| VersionCode | ${{ env.VERSION_CODE }} |" >> CHANGELOG.md
        echo "| Package | tribixbite.cleverkeys |" >> CHANGELOG.md
        echo "| Min Android | 5.0 (API 21) |" >> CHANGELOG.md
        echo "| Target Android | 14 (API 34) |" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Download" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "| Source | Status |" >> CHANGELOG.md
        echo "|--------|--------|" >> CHANGELOG.md
        echo "| **GitHub** | Download APK below for your device |" >> CHANGELOG.md
        echo "| **F-Droid** | Auto-updates within 24-48 hours |" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## APK Variants" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "| ABI | Devices | VersionCode |" >> CHANGELOG.md
        echo "|-----|---------|-------------|" >> CHANGELOG.md
        echo "| **arm64** | Most modern phones (2016+) | $((${{ env.VERSION_CODE }} * 10 + 2)) |" >> CHANGELOG.md
        echo "| **armv7** | Older 32-bit devices | $((${{ env.VERSION_CODE }} * 10 + 1)) |" >> CHANGELOG.md
        echo "| **x86_64** | Emulators, Chromebooks | $((${{ env.VERSION_CODE }} * 10 + 3)) |" >> CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: build/outputs/apk/release/CleverKeys-*.apk
        name: CleverKeys ${{ env.TAG_NAME }}
        tag_name: ${{ env.TAG_NAME }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cleverkeys-release-${{ env.TAG_NAME }}
        path: |
          build/outputs/apk/release/CleverKeys-*.apk
          CHANGELOG.md
        retention-days: 365

    - name: Release summary
      run: |
        echo "## Release ${{ env.TAG_NAME }} Published!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Version Info" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Base VersionCode**: ${{ env.VERSION_CODE }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download" >> $GITHUB_STEP_SUMMARY
        echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### APK Variants" >> $GITHUB_STEP_SUMMARY
        echo "| ABI | VersionCode | Use For |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|-------------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| arm64 | $((${{ env.VERSION_CODE }} * 10 + 2)) | Most modern phones |" >> $GITHUB_STEP_SUMMARY
        echo "| armv7 | $((${{ env.VERSION_CODE }} * 10 + 1)) | Older 32-bit devices |" >> $GITHUB_STEP_SUMMARY
        echo "| x86_64 | $((${{ env.VERSION_CODE }} * 10 + 3)) | Emulators, Chromebooks |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Distribution" >> $GITHUB_STEP_SUMMARY
        echo "- GitHub Release: ✅ Available now" >> $GITHUB_STEP_SUMMARY
        echo "- F-Droid: Auto-update will pick up this version" >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: success()

    steps:
    - name: Release notification
      run: |
        echo "CleverKeys ${{ github.ref_name }} has been successfully released!"
        echo "Users can now download the latest APK with on-device swipe typing."
