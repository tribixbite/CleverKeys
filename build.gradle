  mainClass = 'org.junit.runner.JUnitCore'

  // Build classpath from test + main compiled classes + all dependencies
  // The java-res output dir holds processed test resources (incl. files exposed
  // from src/main/assets via the test sourceSet's resources.srcDirs additions).
  classpath = files(
    "${buildDir}/intermediates/javac/debugUnitTest/classes",
    "${buildDir}/tmp/kotlin-classes/debugUnitTest",
    "${buildDir}/intermediates/javac/debug/classes",
    "${buildDir}/tmp/kotlin-classes/debug",
    "${buildDir}/intermediates/java_res/debugUnitTest/processDebugUnitTestJavaRes/out",
  ) + configurations.debugUnitTestRuntimeClasspath + configurations.debugRuntimeClasspath

  // Forward the geometric-swipe full-grid flag into the forked JVM. Gradle `-P`
  // properties do NOT reach a forked JavaExec, so the geometric accuracy/benchmark
  // tests read System.getProperty("geoFull") — this line bridges `-PgeoFull=true`
  // into that system property (default "false"). See spec Phase-6 item m27.
  systemProperty 'geoFull', (project.findProperty('geoFull') ?: 'false')
  // Wave-G OQ sweep instrument (GeoOqSweepTest) — same bridge pattern; double-heavy
  // measurement runs stay opt-in and skip in milliseconds otherwise.
  systemProperty 'geoSweep', (project.findProperty('geoSweep') ?: 'false')
  systemProperty 'oqOnly', (project.findProperty('oqOnly') ?: '')
  // Sampling knobs for ContextRescoringReplayTest, same -P-to-system-property bridge. Only set
  // when supplied, so the defaults stay in the Kotlin where they are documented. Lets a
  // measurement run be scaled (`-PreplayPairs=800 -PreplayDecoys=6`) without editing the test,
  // and the replay prints whichever values it ran with.
  ['replayPairs', 'replayDecoys', 'replayTraces', 'replayMaxCtx', 'replayCorpus'].each { knob ->
    if (project.hasProperty(knob)) systemProperty knob, project.property(knob)
  }
  // ONNX in PURE JVM tests on Termux.
  //
  // The `onnxruntime` JAR bundles a GLIBC-linked libonnxruntime.so, which cannot load in a
  // bionic JVM — it fails with `dlopen failed: library "libdl.so.2" not found`. That is a
  // property of the bundled .so, NOT of ONNX: the `onnxruntime-android` AAR this project already
  // depends on ships BIONIC arm64-v8a natives. ORT Java reads `onnxruntime.native.path`, so
  // pointing it at those makes the real encoder run in `runPureTests`.
  //
  // Auto-resolved from the AAR in the Gradle cache; override with -PortNative=<dir> if needed.
  def ortNativeDir = project.findProperty('ortNative') ?: "${buildDir}/ort-native/arm64-v8a"
  systemProperty 'onnxruntime.native.path', ortNativeDir

  // Allow single test via -PtestClass=ClassName
  if (project.hasProperty('testClass')) {
    def cls = project.property('testClass')
    args = ["tribixbite.cleverkeys.${cls}"]
  } else {
    args = pureTestClasses
  }
}

// MockK test runner — like runPureTests but with android.jar on classpath.
// Allows MockK to mock Android framework classes (Log, PointF, Context, etc.)
// without Robolectric. The android.jar stubs provide class definitions; MockK
