    'tribixbite.cleverkeys.InputCoordinatorReplayGuardTest',
    'tribixbite.cleverkeys.CleanupHandlerTeardownTest',
    // ARC-016 (2026-08-28): CleanupHandlerTeardownTest above proves cleanup() CALLS
    // shutdown() on MOCK coordinators; this proves the REAL shutdown() bodies stop the
